name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.repository == 'lonestill/onyx-launcher'
    runs-on: ubuntu-24.04
    steps:
      - name: Welcome first-time contributor
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to Onyx Launcher, and thanks for opening your first issue!

            Please make sure you've included:
            - Clear reproduction steps or expected behavior
            - Environment details (OS, Minecraft/loader version, Java runtime)
            - Relevant log lines if reporting a crash

            A maintainer will review this shortly!
          pr-message: |
            🎉 Thanks for opening your first pull request in Onyx Launcher!

            Please double-check that:
            - [ ] `npm run check` passes locally without type, lint, or test failures
            - [ ] User-facing strings and documentation are in English
            - [ ] Visual UI changes include before/after screenshots

            We review pull requests promptly. Thanks for helping make Onyx better!
